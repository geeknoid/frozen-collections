name: main

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV, RUST_NIGHTLY
          cargo-tools: CARGO_NEXTEST_VERSION

      # execute
      - name: Build
        run: cargo build --all-targets --verbose --color always
      - name: Tests
        if: success() || failure()
        run: cargo nextest run --verbose
      - name: Docs
        if: success() || failure()
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"
        run: cargo +${{ env.RUST_NIGHTLY }} doc --no-deps --verbose --all-features
      - name: Doc Tests
        if: success() || failure()
        run: cargo test --doc --verbose --all-features

  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV

      # execute
      - name: Release Build
        run: cargo build --verbose --color always --release

  feature-checks:
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_MSRV
          cargo-tools: CARGO_HACK_VERSION

      # execute
      - name: Validating Feature Combinations
        run: cargo hack check --feature-powerset --workspace

  static-analysis:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_LATEST
          rust-components: clippy, rustfmt
          cargo-tools: CARGO_ENSURE_NO_DEFAULT_FEATURES_VERSION, CARGO_DENY_VERSION, CARGO_SORT_VERSION

      # execute
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Source Format
        if: success() || failure()
        run: cargo fmt -- --check
      - name: Cargo.toml Format
        if: success() || failure()
        run: cargo sort --check --grouped
      - name: Default Features
        if: success() || failure()
        run: cargo ensure-no-default-features
      - name: Dependency Validation
        if: success() || failure()
        run: cargo deny --all-features --color always check all

  spell-check:
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust-toolchain: RUST_LATEST
          cargo-tools: CARGO_SPELLCHECK_VERSION

      - name: Check Spelling
        run: cargo spellcheck --cfg spellcheck.toml --code 1

  extended-analysis:
    name: extended-analysis (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    needs: [testing, static-analysis]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_NIGHTLY
          rust-components: miri
          cargo-tools: CARGO_UDEPS_VERSION, CARGO_CAREFUL_VERSION, CARGO_NEXTEST_VERSION

      # execute
      - name: Udeps
        run: cargo +${{ env.RUST_NIGHTLY }} udeps --all-features --color always
      - name: Careful
        if: success() || failure()
        run: cargo +${{ env.RUST_NIGHTLY }} careful nextest run --all-features --color always --target ${{ matrix.target }}
      - name: Miri
        if: success() || failure()
        run: cargo +${{ env.RUST_NIGHTLY }} miri test --all-features --test omni_tests

  mutation-testing:
    if: github.event_name == 'pull_request'
    needs: [testing]
    runs-on: ubuntu-latest
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          enable-wild-linker: true
          rust-toolchain: RUST_NIGHTLY
          cargo-tools: CARGO_MUTANTS_VERSION

      # execute
      - name: Generate PR Diff
        run: git diff origin/main...HEAD >diff.txt
      - name: Mutate Diff
        timeout-minutes: 45
        run: |
          set +e
          cargo mutants --test-workspace=true --colors=never --jobs=2 --build-timeout=120 --cap-lints=true --in-diff diff.txt
          exit_code=$?
          # Exit code 3 means timeouts only (e.g. infinite loops in const fn evaluation).
          # These are effectively caught mutations, so treat them as success.
          if [ "$exit_code" -eq 0 ] || [ "$exit_code" -eq 3 ]; then
            exit 0
          else
            exit "$exit_code"
          fi

  coverage:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # prep
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup
        uses: ./.github/actions/setup
        with:
          enable-sccache: true
          rust-toolchain: RUST_NIGHTLY
          rust-components: llvm-tools-preview
          cargo-tools: CARGO_LLVM_COV_VERSION

      # execute
      - name: Generate Coverage
        run: cargo +${{ env.RUST_NIGHTLY }} llvm-cov --all-features --workspace --lcov --output-path lcov-all.info
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov-all.info
          fail_ci_if_error: true